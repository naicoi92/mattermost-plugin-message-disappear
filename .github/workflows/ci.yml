name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.9.0
          args: --timeout=5m ./server/...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l server)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Test + coverage (target >= 80%)
        run: |
          go test -race -covermode=atomic -coverprofile=server/coverage.out ./server/...
          cov=$(go tool cover -func=server/coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "coverage: $cov%"
          awk "BEGIN {exit !($cov >= 80)}" || { echo "coverage $cov% below 80%"; exit 1; }

  webapp:
    name: Webapp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package.json
      - name: Install
        working-directory: webapp
        run: npm install
      - name: Typecheck
        working-directory: webapp
        run: npm run check-types
      - name: Build
        working-directory: webapp
        run: npm run build

  bundle:
    name: Bundle (make all)
    runs-on: ubuntu-latest
    needs: [server, webapp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package.json
      - name: make all
        run: make all
