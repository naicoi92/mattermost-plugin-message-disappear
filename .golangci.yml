version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      # G201/G202 flag SQL string formatting/concatenation. They are false
      # positives here: dynamic IN clauses use generated placeholders with
      # parameterized args; table/column names are package constants.
      excludes:
        - G201
        - G202
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    paths:
      - webapp
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/naicoi92/mattermost-plugin-message-disappear
